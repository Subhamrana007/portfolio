<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags define information about the HTML document -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- The <title> appears in the browser tab -->
    <title>Portfolio Coming Soon</title>

    <!-- Basic CSS for styling the page -->
    <style>
        /* Apply styles to the entire page */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Style the main container */
        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Style the main heading */
        h1 {
            color: #0056b3;
            font-size: 2.5em;
        }

        /* Style the paragraph text */
        p {
            font-size: 1.1em;
        }

        /* Style the meme image */
        img {
            max-width: 250px; /* Control the meme size */
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- This is the main content container -->
    <div class="container">
        
        <!-- A silly meme -->
        <img src="fg.jpeg" 
             alt="This is fine dog meme"
             onerror="this.onerror=null;this.src='https://placehold.co/250x190/f4f4f4/333?text=Meme+Not+Found';">
        
        <!-- A top-level heading -->
        <h1>Portfolio Under Construction</h1>
        
        <!-- A paragraph of text -->
        <p>Me while Building the portfolio. Please check back later!</p>

    </div>

    <!-- You can link your JavaScript file here, just before the closing </body> tag -->
    <!-- <script src="app.js"></script> -->

</body>
</html>
